name: Inspect Quote source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Quote.mp4", ".github/workflows/render.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Inspect only Quote.mp4
        run: |
          test -s Quote.mp4
          ffprobe -v error -count_frames -show_streams -show_format -of json Quote.mp4
          mkdir -p inspection
          ffmpeg -hide_banner -loglevel error -i Quote.mp4 -vf "scale=320:180,tile=7x3" -frames:v 1 inspection/source-sheet.jpg
          ffmpeg -hide_banner -loglevel error -i Quote.mp4 -vf "select=eq(n\\,12)" -frames:v 1 inspection/source-final.jpg
          node --input-type=module -e 'import fs from "node:fs"; for(const name of ["source-sheet","source-final"]) console.log("IMAGE_"+name+":"+fs.readFileSync("inspection/"+name+".jpg").toString("base64"));'
