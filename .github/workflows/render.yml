name: Test captions and zooms with HyperFrames

on:
  workflow_dispatch:
  push:
    branches: [codex/render-test-2026-10-08]
    paths:
      - "*.mp4"
      - "scripts/**"
      - ".github/workflows/render.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Find uploaded video
        shell: bash
        run: |
          VIDEO="$(find . -maxdepth 1 -type f -name '*.mp4' | head -n 1)"
          if [ -z "$VIDEO" ]; then
            echo "No MP4 found in repository root."
            exit 1
          fi
          echo "VIDEO=$VIDEO" >> "$GITHUB_ENV"
          echo "Using $VIDEO"

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg cmake build-essential
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          google-chrome --version || chromium --version || true

      - name: Install HyperFrames
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          if ! npm install --no-audit --no-fund hyperframes@0.8.4; then
            npm install --no-audit --no-fund @hyperframes/cli@0.8.4
          fi
          ./node_modules/.bin/hyperframes --version

      - name: Transcribe dialogue for captions
        continue-on-error: true
        shell: bash
        run: |
          ./node_modules/.bin/hyperframes transcribe "$VIDEO"             --model tiny.en             --language en             --dir .             --timeout 900000

      - name: Build content-aware composition
        shell: bash
        run: |
          node scripts/build-composition.mjs "$VIDEO"
          cat transcript.json
          cat edit-report.json

      - name: Lint composition
        continue-on-error: true
        shell: bash
        run: |
          ./node_modules/.bin/hyperframes lint .

      - name: Render edited MP4
        shell: bash
        run: |
          mkdir -p renders
          ./node_modules/.bin/hyperframes render .             --output renders/cruz-edited.mp4             --quality high             --workers 2             --no-browser-gpu

      - name: Verify rendered video and make preview
        shell: bash
        run: |
          ffprobe -v error -show_streams -show_format -of json renders/cruz-edited.mp4 > renders/probe.json
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("renders/probe.json")); const e=JSON.parse(fs.readFileSync("edit-report.json")); if(!p.streams.some(s=>s.codec_type==="video") || !p.streams.some(s=>s.codec_type==="audio") || Math.abs(Number(p.format.duration)-e.duration)>0.2 || e.captions<1 || e.zooms<1) throw Error("Render verification failed"); console.log("VERIFIED", JSON.stringify(e));'
          ffmpeg -hide_banner -loglevel error -i renders/cruz-edited.mp4 -vf "fps=1,scale=270:-1,tile=4x3" -frames:v 1 renders/preview.jpg

      - name: Upload render and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cruz-captions-zoom-test
          path: |
            renders/
            edit-report.json
            index.html
            transcript.json
          if-no-files-found: warn
          retention-days: 7
